name: lingostream_universal
description: "Platform Belajar Bahasa Imersif Berbasis Video YouTube Universal"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  youtube_player_flutter: ^9.1.1
  flutter_tts: ^4.2.2
  shared_preferences: ^2.3.2
  record: ^5.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  record_linux: 2.1.3
  record_platform_interface: 2.1.0

flutter:
  uses-material-design: true
